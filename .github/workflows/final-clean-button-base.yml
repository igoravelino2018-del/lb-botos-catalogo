name: Final clean button base
on:
  push:
    paths:
      - '.github/workflows/final-clean-button-base.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply clean base behind mobile buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n/* final white base behind mobile CTAs */\n@media(max-width:700px){\n  .m-primary,.m-whatsapp{\n    z-index:30!important;\n    top:91.45%!important;\n    height:6.0%!important;\n    border-radius:8px!important;\n    box-shadow:0 0 0 12px #fff!important;\n  }\n  .m-primary{\n    left:4.6%!important;\n    width:44.4%!important;\n    background:#c8101e!important;\n    color:#fff!important;\n    border:1.5px solid #c8101e!important;\n  }\n  .m-whatsapp{\n    left:51.3%!important;\n    width:44.1%!important;\n    background:#fff!important;\n    color:#b30d18!important;\n    border:1.5px solid #b30d18!important;\n  }\n}\n'''
          if '/* final white base behind mobile CTAs */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: add clean white base behind mobile CTAs' || exit 0
          git push

name: Final seam fix
on:
  push:
    paths:
      - '.github/workflows/final-seam-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch seam
        run: sed -i '0,/<\/style>/s//@media(max-width:700px){.buy-guide{position:relative;z-index:12;margin-top:-7px!important;border-top:0!important}}<\/style>/' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: cover red seam below mobile hero'
          git push

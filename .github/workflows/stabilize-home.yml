name: Stabilize homepage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-home.yml'
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/stabilize-home.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: stabilize hero and full catalog"
          git push

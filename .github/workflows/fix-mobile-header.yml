name: Fix mobile header
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-header.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean mobile hero header
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n/* clean mobile header */\n@media(max-width:700px){\n  .mobile-hero::before{content:""!important;position:absolute!important;left:0!important;top:0!important;width:100%!important;height:8.8%!important;background:#fff!important;z-index:6!important;pointer-events:none!important}\n  .mobile-hero::after{content:"LB MOTOS";position:absolute;left:5.2%;top:2.2%;z-index:7;color:#c8101e;font-family:Inter,Arial,sans-serif;font-size:clamp(22px,7vw,34px);font-weight:900;line-height:1;letter-spacing:-.04em;pointer-events:none}\n  .m-topwa{display:none!important}\n}\n'''
          if '/* clean mobile header */' not in s:
              s=s.replace('</style>', css+'</style>',1)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: clean mobile hero header"
          git push

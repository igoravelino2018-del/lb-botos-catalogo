name: Apply reference layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-clean-hero.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout
        run: python scripts/apply-reference-layout.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "ui: match approved homepage reference"
          git push

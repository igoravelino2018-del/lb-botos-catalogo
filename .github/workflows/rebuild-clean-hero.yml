name: Rebuild clean hero
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-clean-hero.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild responsive hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='</style>'
          css=r'''
/* clean responsive hero v2 */
.hero{background:#fff;overflow:hidden;border-bottom:1px solid #ececec}
.hero-clean{max-width:1280px;margin:0 auto;min-height:520px;display:grid;grid-template-columns:47% 53%;align-items:stretch;position:relative;background:linear-gradient(112deg,#fff 0%,#fff 61%,#f8f4f4 61%,#f8f4f4 100%)}
.hero-copy-clean{padding:58px 28px 52px 54px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:4}
.hero-brandline{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:#7f1d23;font-weight:900;letter-spacing:.03em}.hero-brandline .lb-clean{font-family:Georgia,serif;font-size:30px;font-weight:500;letter-spacing:0}.hero-brandline .multi-clean{font-size:11px;border-top:1px solid #8f2227;border-bottom:1px solid #8f2227;padding:4px 0;color:#3a3a3a}
.hero-copy-clean h1{margin:0;color:#8f2227;font-size:clamp(42px,5.1vw,72px);line-height:.98;letter-spacing:-.045em;font-weight:950;max-width:620px}.hero-copy-clean p{margin:18px 0 0;color:#5f5f5f;font-size:clamp(15px,1.35vw,19px);line-height:1.4;max-width:560px}
.hero-ctas-clean{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}.hero-cta-clean{min-height:50px;padding:0 22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px;font-weight:900;transition:transform .18s ease,box-shadow .18s ease}.hero-cta-clean:hover{transform:translateY(-2px)}.hero-cta-primary{background:#8f2227;color:#fff;box-shadow:0 8px 20px #8f222728}.hero-cta-secondary{background:#fff;color:#242424;border:1px solid #dadada;box-shadow:0 7px 20px #0000000b}
.hero-visual-clean{position:relative;min-height:520px;overflow:hidden}.hero-red-shape{position:absolute;inset:0 0 0 45%;background:linear-gradient(145deg,#9c2a30,#76191f);clip-path:polygon(26% 0,100% 0,100% 100%,0 100%);z-index:0}.hero-owner-clean{position:absolute;right:25%;bottom:0;height:94%;width:42%;object-fit:cover;object-position:50% 18%;z-index:2;filter:drop-shadow(0 8px 18px #0000001a)}.hero-bike-clean{position:absolute;object-fit:contain;z-index:3;filter:drop-shadow(0 15px 18px #00000035)}.hero-adv-clean{right:1%;bottom:4%;width:45%;max-height:255px}.hero-pcx-clean{left:0%;bottom:1%;width:46%;max-height:238px}.hero-model-note{position:absolute;right:18px;top:18px;z-index:5;background:#ffffffeb;border:1px solid #e5dddd;color:#7f1d23;padding:8px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.035em}
@media(max-width:900px){.hero-clean{grid-template-columns:1fr;min-height:0;background:#fff}.hero-copy-clean{padding:34px 22px 26px;text-align:center;align-items:center}.hero-brandline{margin-bottom:15px}.hero-copy-clean h1{font-size:clamp(35px,9vw,54px);max-width:650px}.hero-copy-clean p{max-width:570px;margin-top:13px}.hero-ctas-clean{width:100%;justify-content:center;margin-top:21px}.hero-cta-clean{flex:1 1 210px;max-width:300px}.hero-visual-clean{min-height:390px;background:linear-gradient(160deg,#fff 0%,#fff 47%,#f7eded 47%,#f7eded 100%)}.hero-red-shape{inset:18% 0 0 48%;clip-path:polygon(26% 0,100% 0,100% 100%,0 100%)}.hero-owner-clean{height:88%;width:38%;right:31%;object-position:50% 15%}.hero-pcx-clean{left:1%;bottom:2%;width:44%;max-height:190px}.hero-adv-clean{right:1%;bottom:5%;width:45%;max-height:205px}.hero-model-note{top:12px;right:12px}}
@media(max-width:560px){.hero-copy-clean{padding:26px 15px 20px}.hero-brandline .lb-clean{font-size:25px}.hero-copy-clean h1{font-size:37px}.hero-copy-clean p{font-size:14px}.hero-ctas-clean{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hero-cta-clean{min-height:48px;padding:0 12px;font-size:13px;max-width:none}.hero-visual-clean{min-height:320px}.hero-owner-clean{height:86%;width:45%;right:27%;object-position:50% 15%}.hero-pcx-clean{left:-2%;bottom:1%;width:48%;max-height:150px}.hero-adv-clean{right:-2%;bottom:4%;width:49%;max-height:160px}.hero-model-note{font-size:9px;padding:6px 8px}}
'''
          if '/* clean responsive hero v2 */' not in s:
              s=s.replace(marker,css+'\n'+marker,1)
          start=s.index('<section class="hero" aria-label="LB MOTOS Honda 0 KM">')
          end=s.index('<section class="buy-guide"', start)
          hero=r'''<section class="hero" aria-label="LB MOTOS Honda 0 KM">
  <div class="hero-clean">
    <div class="hero-copy-clean">
      <div class="hero-brandline"><span class="lb-clean">LB MOTOS</span><span class="multi-clean">MULTIMARCAS</span></div>
      <h1>VENHA CONQUISTAR A SUA HONDA 0 KM AQUI NA LB MOTOS</h1>
      <p>Escolha seu modelo, veja os lançamentos e fale com a nossa equipe para encontrar a melhor condição para você.</p>
      <div class="hero-ctas-clean">
        <a class="hero-cta-clean hero-cta-primary" href="#catalogMount">Ver motos 0 km</a>
        <a class="hero-cta-clean hero-cta-secondary" href="https://wa.me/5521970993229">Falar no WhatsApp</a>
      </div>
    </div>
    <div class="hero-visual-clean" aria-hidden="true">
      <div class="hero-red-shape"></div>
      <span class="hero-model-note">HONDA 0 KM</span>
      <img class="hero-owner-clean" src="/assets/laysa.jpg?v=2" alt="">
      <img class="hero-bike-clean hero-pcx-clean" src="https://www.honda.com.br/motos/sites/hda/files/2025-08/imagem-home-honda-pcx-branco.webp" alt="">
      <img class="hero-bike-clean hero-adv-clean" src="https://www.honda.com.br/motos/sites/hda/files/2025-08/Imagem-home-Honda-ADV-Vermelha-Lateral.webp" alt="">
    </div>
  </div>
  <img id="heroImageDesktop" alt="" style="display:none">
  <img id="heroImageMobile" alt="" style="display:none">
</section>
'''
          s=s[:start]+hero+s[end:]
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "ui: rebuild clean responsive hero"
          git push

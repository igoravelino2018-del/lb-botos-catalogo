name: Redesign mobile brand
on:
  push:
    paths:
      - '.github/workflows/redesign-mobile-brand.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign mobile brand header
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''
/* branded mobile header */
@media(max-width:700px){
  .mobile-hero::before{
    content:""!important;
    position:absolute!important;
    left:0!important;
    top:0!important;
    width:100%!important;
    height:8.6%!important;
    background:#fff!important;
    border-bottom:1px solid #ececec!important;
    z-index:6!important;
    pointer-events:none!important;
  }
  .mobile-hero::after{
    content:"LB MOTOS\\A MULTIMARCAS";
    white-space:pre;
    position:absolute;
    left:5.4%;
    top:1.45%;
    z-index:7;
    color:#a90f18;
    font-family:Arial,Helvetica,sans-serif;
    font-size:clamp(24px,7.5vw,36px);
    font-weight:900;
    line-height:.88;
    letter-spacing:-.045em;
    pointer-events:none;
  }
  .mobile-hero .brand-accent{
    position:absolute;
    left:5.6%;
    top:6.72%;
    width:12.5%;
    height:3px;
    border-radius:999px;
    background:#a90f18;
    z-index:8;
    pointer-events:none;
  }
  .mobile-hero .brand-sub{
    position:absolute;
    left:5.55%;
    top:5.55%;
    z-index:8;
    color:#333;
    font-family:Arial,Helvetica,sans-serif;
    font-size:clamp(7px,2.05vw,10px);
    font-weight:800;
    line-height:1;
    letter-spacing:.32em;
    pointer-events:none;
  }
  .m-topwa{display:none!important}
}
'''
          if '/* branded mobile header */' not in s:
            s=s.replace('</style>',css+'\n</style>',1)
          s=s.replace('<div class="mobile-hero"><img id="heroImageMobile"', '<div class="mobile-hero"><span class="brand-sub">MULTIMARCAS</span><span class="brand-accent"></span><img id="heroImageMobile"')
          # Make pseudo text only show LB MOTOS because subtitle is separate
          s=s.replace('content:"LB MOTOS\\A MULTIMARCAS";', 'content:"LB MOTOS";')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: improve LB Motos Multimarcas mobile branding'
          git push

name: Polish mobile hero buttons
on:
  push:
    paths:
      - '.github/workflows/polish-mobile-hero-buttons.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish buttons only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n/* polished mobile hero buttons */\n@media(max-width:700px){\n  .m-primary,.m-whatsapp{\n    display:flex!important;align-items:center!important;justify-content:center!important;\n    text-decoration:none!important;line-height:1!important;\n    font-family:Inter,Arial,sans-serif!important;font-weight:900!important;\n    font-size:clamp(12px,3.35vw,16px)!important;letter-spacing:-.02em!important;\n    border-radius:14px!important;box-shadow:0 7px 18px #00000024!important;\n    overflow:hidden!important;z-index:9!important;\n    transition:transform .16s ease,box-shadow .16s ease!important;\n  }\n  .m-primary{background:linear-gradient(180deg,#d20b18 0%,#b40712 100%)!important;color:#fff!important;border:1px solid #9f0710!important}\n  .m-primary:before{content:'Ver motos 0 km';white-space:nowrap}\n  .m-primary:after{content:'›';font-size:1.55em;line-height:.7;margin-left:8px;margin-top:-1px}\n  .m-whatsapp{background:#fff!important;color:#b40712!important;border:2px solid #b40712!important}\n  .m-whatsapp:before{content:'Falar no WhatsApp';white-space:nowrap}\n  .m-primary:active,.m-whatsapp:active{transform:translateY(1px) scale(.99)!important;box-shadow:0 3px 10px #00000020!important}\n}\n'''
          if '/* polished mobile hero buttons */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: polish mobile hero CTA buttons'
          git push

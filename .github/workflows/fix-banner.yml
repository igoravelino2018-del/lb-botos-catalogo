name: Corrigir banner
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir src do banner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'https://raw.githubusercontent.com/igoravelino2018-del/lb-botos-catalogo/main/hero.jpg?v=3'
          new = '/hero.jpg?v=4'
          if old not in s:
              raise SystemExit('URL antiga do banner nao encontrada')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remover workflow temporario e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-banner.yml
          git commit -m "Corrige banner para arquivo local"
          git push origin main

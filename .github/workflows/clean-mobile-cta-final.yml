name: Clean mobile CTA final
on:
  push:
    paths:
      - '.github/workflows/clean-mobile-cta-final.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply clean CTA override
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n/* clean mobile CTA definitive */\n@media(max-width:700px){\n  .m-primary,.m-whatsapp{\n    top:91.75%!important;height:5.85%!important;\n    display:flex!important;align-items:center!important;justify-content:center!important;\n    border-radius:7px!important;box-shadow:none!important;transform:none!important;\n    background-image:none!important;text-shadow:none!important;\n    font-family:Arial,Helvetica,sans-serif!important;font-size:clamp(11.5px,3.05vw,14px)!important;\n    font-weight:800!important;letter-spacing:-.01em!important;line-height:1!important;\n    padding:0 8px!important;text-decoration:none!important;z-index:10!important;\n  }\n  .m-primary{left:4%!important;width:45%!important;background:#c9101c!important;color:#fff!important;border:1px solid #c9101c!important}\n  .m-primary:before{content:'Ver motos 0 km'!important;white-space:nowrap!important}\n  .m-primary:after{content:'›'!important;font-size:1.25em!important;margin-left:6px!important;line-height:1!important}\n  .m-whatsapp{left:51%!important;width:45%!important;background:#fff!important;color:#b70d18!important;border:1px solid #b70d18!important}\n  .m-whatsapp:before{content:'Falar no WhatsApp'!important;white-space:nowrap!important}\n  .m-whatsapp:after{content:none!important}\n}\n'''
          if '/* clean mobile CTA definitive */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: clean mobile CTA buttons' || true
          git push

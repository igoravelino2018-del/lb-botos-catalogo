name: Refine mobile hero buttons
on:
  push:
    paths:
      - '.github/workflows/refine-mobile-hero-buttons.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append final mobile button styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* final clean mobile hero buttons */'
          css='''\n/* final clean mobile hero buttons */\n@media(max-width:700px){\n  .m-primary,.m-whatsapp{\n    top:91.65%!important;\n    height:6.45%!important;\n    border-radius:9px!important;\n    box-shadow:none!important;\n    font-size:clamp(12px,3.2vw,15px)!important;\n    font-weight:850!important;\n    letter-spacing:-.015em!important;\n  }\n  .m-primary{\n    background:#c8101e!important;\n    color:#fff!important;\n    border:2px solid #c8101e!important;\n  }\n  .m-primary:after{\n    font-size:1.35em!important;\n    margin-left:7px!important;\n    margin-top:-1px!important;\n  }\n  .m-whatsapp{\n    background:#fff!important;\n    color:#b30d18!important;\n    border:2px solid #b30d18!important;\n  }\n  .m-primary:active,.m-whatsapp:active{\n    transform:none!important;\n    box-shadow:none!important;\n  }\n}\n'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: refine mobile hero buttons' || exit 0
          git push

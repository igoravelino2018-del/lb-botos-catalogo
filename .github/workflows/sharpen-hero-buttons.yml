name: Sharpen hero buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sharpen-hero-buttons.yml'
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve hero CTA definition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='.mobile-hero{display:none}.loading{padding:32px;text-align:center;color:#777}'
          css='''.hero-primary,.hero-whatsapp{display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-.015em;line-height:1;text-align:center;box-shadow:0 5px 14px #00000022;transition:transform .18s ease,box-shadow .18s ease;overflow:hidden}.hero-primary{background:#8f2227;color:#fff;border:2px solid #8f2227;font-size:clamp(13px,1.08vw,19px)}.hero-primary:after{content:'Ver motos 0 km'}.hero-whatsapp{background:#fff;color:#202020;border:2px solid #dedede;font-size:clamp(13px,1.02vw,18px)}.hero-whatsapp:after{content:'Falar no WhatsApp'}.hero-primary:hover,.hero-whatsapp:hover{transform:translateY(-2px);box-shadow:0 8px 18px #0000002e}.hero-primary:focus-visible,.hero-whatsapp:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 5px #8f2227}.m-primary,.m-whatsapp{display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:Inter,Arial,sans-serif;font-weight:900;line-height:1;text-align:center;overflow:hidden;box-shadow:0 4px 12px #00000026}.m-primary{background:#8f2227;color:#fff;border:2px solid #8f2227}.m-primary:after{content:'Ver motos 0 km'}.m-whatsapp{background:#fff;color:#202020;border:2px solid #dedede}.m-whatsapp:after{content:'Falar no WhatsApp'}'''
          if css not in s:
              s=s.replace(marker, marker+'\n'+css)
          mobile='.m-whatsapp{left:51.2%;top:84.1%;width:44.5%;height:6.5%}'
          mobile_extra=".m-primary,.m-whatsapp{font-size:clamp(11px,3.35vw,15px);border-radius:10px}.m-primary{letter-spacing:-.02em}.m-whatsapp{letter-spacing:-.025em}"
          if mobile_extra not in s:
              s=s.replace(mobile, mobile+mobile_extra)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "ui: sharpen hero CTA buttons"
          git push

name: Refresh launch photos

on:
  push:
    paths:
      - '.github/workflows/refresh-launch-photos.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update official Honda photos
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'https://www.honda.com.br/motos/sites/hda/files/2025-08/Imagem-Home-Honda-CG-160-Titan-Cinza-Met%C3%A1lico_0.webp': 'https://www.honda.com.br/motos/sites/hda/files/2026-10/CG%20Titan%203.4%20FD%20Azul%20copy.webp',
              'https://www.honda.com.br/motos/sites/hda/files/2025-08/Imagem-Home-Honda-CG-160-Titan-Cinza-Metálico_0.webp': 'https://www.honda.com.br/motos/sites/hda/files/2026-10/CG%20Titan%203.4%20FD%20Azul%20copy.webp',
              'https://www.honda.com.br/motos/sites/hda/files/2026-09/Twister%20ABS%20Vermelha%20-%20Lateral_2.webp': 'https://www.honda.com.br/motos/sites/hda/files/2026-08/HDA_K2KH_ABS.webp',
              'https://www.honda.com.br/motos/sites/hda/files/2026-02/Moto-cg-vis%C3%A3o-lateral-direita_0.webp': 'https://www.honda.com.br/motos/sites/hda/files/2026-02/Moto-cg-vis%C3%A3o-lateral-direita.webp',
          }

          changed = []
          for filename in ('index.html', 'catalog-core.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')
                  changed.append(filename)

          print('Updated:', ', '.join(changed) if changed else 'nothing')
      - name: Commit changes
        run: |
          git config user.name "LB Motos site updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html catalog-core.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: use current Honda model photos"
          git push

name: Final mobile buttons
on:
  push:
    paths:
      - '.github/workflows/final-mobile-buttons.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final button styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n/* final clean mobile hero buttons */\n@media(max-width:700px){\n  .m-primary,.m-whatsapp{\n    display:flex!important;align-items:center!important;justify-content:center!important;\n    height:6.35%!important;top:91.55%!important;\n    border-radius:8px!important;box-shadow:none!important;\n    font-family:Inter,Arial,sans-serif!important;font-weight:850!important;\n    font-size:clamp(12px,3.2vw,15px)!important;letter-spacing:-.015em!important;\n    line-height:1!important;text-decoration:none!important;overflow:hidden!important;\n  }\n  .m-primary{\n    left:3.8%!important;width:46%!important;\n    background:#c90d18!important;color:#fff!important;border:1.5px solid #c90d18!important;\n  }\n  .m-primary:before{content:'Ver motos 0 km';white-space:nowrap!important}\n  .m-primary:after{content:'›';font-size:1.35em!important;margin-left:7px!important;line-height:.8!important}\n  .m-whatsapp{\n    left:51.2%!important;width:44.5%!important;\n    background:#fff!important;color:#b20c16!important;border:1.5px solid #b20c16!important;\n  }\n  .m-whatsapp:before{content:'Falar no WhatsApp';white-space:nowrap!important}\n  .m-whatsapp:after{content:none!important}\n}\n'''
          if '/* final clean mobile hero buttons */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ui: finalize mobile hero buttons' || exit 0
          git push

name: Remove top payment details
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-hero-payment-details.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove payment badges from top catalog area
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='#catalogMount .trust{gap:6px!important;margin-top:10px!important}'
          replacement='#catalogMount .trust{display:none!important;gap:6px!important;margin-top:10px!important}'
          if marker in s:
              s=s.replace(marker,replacement,1)
          elif '#catalogMount .trust{display:none!important' not in s:
              s=s.replace('</style>','#catalogMount .trust{display:none!important}\n</style>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "ui: remove payment badges from top area"
          git push

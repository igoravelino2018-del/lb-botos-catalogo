name: Remove top payment details
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-hero-payment-details.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove payment badges from top catalog area
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          rule='#catalogMount .trust{display:none!important}'
          # Keep the desktop rule and add a final override after the mobile media rule,
          # so the payment badges stay hidden on every screen size.
          if s.count(rule) < 2:
              s=s.replace('</style>',rule+'\n</style>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "ui: hide top payment badges on all screens"
          git push

name: Fix hero layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-hero-payment-details.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix desktop and mobile hero
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n/* hero cleanup */\n.desktop-subtitle{display:none!important}\n.desktop-hero::after{content:"";position:absolute;left:0;bottom:0;width:46%;height:8.2%;background:#fff;z-index:4;pointer-events:none}\n.mobile-hero::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:8.2%;background:#fff;z-index:4;pointer-events:none}\n.mobile-hero::before{content:"";position:absolute;left:58.4%;top:.6%;width:38.2%;height:6.2%;background:#fff;z-index:4;pointer-events:none}\n.m-topwa{display:none!important}\n#catalogMount .trust{display:none!important}\n'''
          start='/* hero cleanup */'
          if start in s:
              a=s.index(start)
              b=s.index('</style>',a)
              s=s[:a]+css.strip()+"\n"+s[b:]
          else:
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "ui: remove duplicate mobile WhatsApp CTA"
          git push

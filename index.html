<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LB MOTOS | Honda 0 KM</title>
<meta name="description" content="Catálogo LB MOTOS - Honda 0 KM">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:#f7f7f7;color:#171717;font-family:Inter,Arial,sans-serif;overflow-x:hidden}
.hero{position:relative;width:100%;background:#fff;overflow:hidden}
.desktop-hero{position:relative;width:100%;overflow:hidden}
.desktop-hero img{display:block;width:100%;height:auto}
.desktop-subtitle{position:absolute;left:5.2%;top:58%;z-index:4;width:32%;margin:0;padding:6px 10px 7px 0;background:rgba(255,255,255,.96);color:#303030;font-weight:750;font-size:clamp(18px,1.72vw,30px);line-height:1.2;letter-spacing:-.02em}
.hero-hot{position:absolute;z-index:5;display:block;border-radius:12px}
.hero-primary{left:5%;bottom:10.4%;width:17.5%;height:8.8%}
.hero-whatsapp{left:23.2%;bottom:10.4%;width:19%;height:8.8%}
.mobile-final{display:none;position:relative;width:100%;background:#fff;overflow:hidden}
.mobile-final img{display:block;width:100%;height:auto;opacity:0;transition:opacity .18s ease}
.mobile-final img.ready{opacity:1}
.mobile-hot{position:absolute;z-index:6;display:block}
.mobile-hot.top-wa{left:55.5%;top:1.1%;width:41%;height:5.2%}
.mobile-hot.models{left:3.5%;top:78.2%;width:43.5%;height:7.2%}
.mobile-hot.whatsapp{left:47.5%;top:78.2%;width:41.5%;height:7.2%}
.loading{padding:32px;text-align:center;color:#777}
#catalogMount .tools{position:relative!important;top:auto!important;margin:0!important;background:#8f2227!important;border:0!important;padding:14px 18px 12px!important;box-shadow:none!important}
#catalogMount .toolrow{max-width:1180px!important;margin:auto!important;display:flex!important;align-items:center!important;gap:8px!important;flex-wrap:wrap!important}
#catalogMount .search{min-height:50px!important;border:1px solid #d8d8d8!important;border-radius:12px!important;background:#fff!important;box-shadow:none!important;font-size:17px!important;padding:0 16px!important}
#catalogMount .filters{gap:7px!important}
#catalogMount .filter{min-height:40px!important;padding:8px 14px!important;border-radius:999px!important;background:#fff!important;border:1px solid #ddd!important;color:#333!important;font-size:13px!important}
#catalogMount .filter.on{background:#171717!important;color:#fff!important;border-color:#171717!important}
#catalogMount .main{padding-top:22px!important;background:#f7f7f7!important}
#catalogMount .catalog-head h1{color:#8f2227!important;font-size:clamp(27px,3.4vw,35px)!important;line-height:1.06!important;margin:0!important;letter-spacing:-.025em!important}
#catalogMount .catalog-head h1:before{content:none!important}
#catalogMount .catalog-head p{color:#707070!important;max-width:620px!important;margin-top:9px!important;line-height:1.35!important}
#catalogMount .trust{gap:6px!important;margin-top:10px!important}
#catalogMount .trust span{background:#fff!important;border:1px solid #dedede!important;border-radius:999px!important;padding:6px 9px!important;font-size:10.5px!important;color:#333!important;white-space:nowrap!important}
#catalogMount .count{color:#777!important;margin:12px 0 14px!important;font-size:14px!important}
#catalogMount .grid{gap:14px!important}
#catalogMount .card{border-radius:14px!important;border:1px solid #e5e5e5!important;box-shadow:0 4px 14px #00000008!important;overflow:hidden!important}
#catalogMount .pic{height:190px!important;background:#fff!important;padding:10px!important}
#catalogMount .pic img{max-width:100%!important}
#catalogMount .info{padding:14px!important}
#catalogMount .name{font-size:17px!important;margin:7px 0 11px!important}
#catalogMount .price{font-size:25px!important;color:#8f2227!important}
#catalogMount .interest{min-height:42px!important;margin-top:7px!important;background:#8f2227!important;border-radius:10px!important}
@media(max-width:700px){
  .desktop-hero{display:none}
  .mobile-final{display:block;min-height:calc(100vw * 1.7779)}
  #catalogMount .tools{padding:12px!important}
  #catalogMount .toolrow{display:block!important;width:100%!important}
  #catalogMount .search{width:100%!important;min-height:48px!important;font-size:16px!important;border-radius:11px!important}
  #catalogMount .filters{width:100%!important;margin-top:9px!important;display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important;padding-bottom:3px!important;scrollbar-width:none}
  #catalogMount .filters::-webkit-scrollbar{display:none}
  #catalogMount .filter{min-height:40px!important;padding:8px 13px!important;font-size:12.5px!important;flex:0 0 auto!important}
  #catalogMount .main{padding:18px 12px 36px!important;width:100%!important;overflow:hidden!important}
  #catalogMount .catalog-head h1{font-size:28px!important}
  #catalogMount .catalog-head p{font-size:14px!important}
  #catalogMount .trust{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;scrollbar-width:none}
  #catalogMount .grid{grid-template-columns:1fr!important;gap:12px!important}
  #catalogMount .pic{height:190px!important}
  #catalogMount .pic img{width:100%!important;height:100%!important;object-fit:contain!important}
}
</style>
</head>
<body>
<section class="hero" aria-label="LB MOTOS Honda 0 KM">
  <div class="desktop-hero">
    <img id="heroImageDesktop" alt="LB MOTOS com Laysa, Honda ADV e Honda PCX">
    <p class="desktop-subtitle">As melhores condições, atendimento de verdade e toda a qualidade Honda para você.</p>
    <a class="hero-hot hero-primary" href="#catalogMount" aria-label="Ver motos 0 km"></a>
    <a class="hero-hot hero-whatsapp" href="https://wa.me/5521970993229" aria-label="Falar no WhatsApp"></a>
  </div>
  <div class="mobile-final" aria-label="LB MOTOS Honda 0 KM">
    <img id="heroImageMobile" alt="LB MOTOS: conquiste sua Honda 0 KM com Laysa, ADV 160 e PCX">
    <a class="mobile-hot top-wa" href="https://wa.me/5521970993229" aria-label="Falar no WhatsApp"></a>
    <a class="mobile-hot models" href="#catalogMount" aria-label="Ver motos 0 km"></a>
    <a class="mobile-hot whatsapp" href="https://wa.me/5521970993229" aria-label="Falar no WhatsApp"></a>
  </div>
</section>
<div id="catalogMount"><div class="loading">Carregando catálogo...</div></div>
<script>
(async()=>{
  try{
    const ps=await Promise.all(Array.from({length:7},(_,i)=>fetch(`/assets/hero-chunks/part${String(i+1).padStart(2,'0')}.txt?v=11`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('hero');return r.text()})));
    document.getElementById('heroImageDesktop').src='data:image/webp;base64,'+ps.join('').replace(/\s/g,'');
  }catch(e){document.getElementById('heroImageDesktop').src='/assets/hero-desktop-v2.webp?v=11'}
  try{
    const b64=await fetch('/assets/hero-mobile-final.webp.b64?v=11',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('mobile hero');return r.text()});
    const m=document.getElementById('heroImageMobile');
    m.onload=()=>m.classList.add('ready');
    m.src='data:image/webp;base64,'+b64.replace(/\s/g,'');
  }catch(e){
    const m=document.getElementById('heroImageMobile');
    m.style.opacity='1';
  }
  try{
    const html=await fetch('/catalog-core.html?v=4').then(r=>r.text());
    const doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('style').forEach(s=>{const n=document.createElement('style');n.textContent=s.textContent;document.head.insertBefore(n,document.head.firstChild)});
    const mount=document.querySelector('#catalogMount');
    mount.innerHTML='';
    ['.tools','main','#bikeModal','#leadModal','.foot'].forEach(sel=>{const el=doc.querySelector(sel);if(el)mount.appendChild(document.importNode(el,true))});
    const src=doc.querySelector('script');
    if(src){const s=document.createElement('script');s.textContent=src.textContent;document.body.appendChild(s)}
  }catch(e){document.getElementById('catalogMount').innerHTML='<div class="loading">Não foi possível carregar o catálogo agora. <a href="https://wa.me/5521970993229">Fale no WhatsApp</a>.</div>'}
})();
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LB MOTOS | Honda 0 KM</title>
<meta name="description" content="Catálogo LB MOTOS - Honda 0 KM">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:#f7f7f7;color:#171717;font-family:Inter,Arial,sans-serif;overflow-x:hidden}
.hero{position:relative;width:100%;background:#fff;overflow:hidden}
.hero picture,.hero img{display:block;width:100%}
.hero img{height:auto;max-width:100%}
.hero-cta{position:absolute;left:4.3%;bottom:5.1%;width:34%;height:9.5%;z-index:5;border-radius:14px;display:block}
.hero-cta:focus{outline:3px solid #fff;box-shadow:0 0 0 5px #8f2227}
.loading{padding:32px;text-align:center;color:#777}
#catalogMount .tools{position:relative!important;top:auto!important;margin:0!important;background:#8f2227!important;border:0!important;padding:14px 18px 12px!important;box-shadow:none!important}
#catalogMount .toolrow{max-width:1180px!important;margin:auto!important;display:flex!important;align-items:center!important;gap:8px!important;flex-wrap:wrap!important}
#catalogMount .search{min-height:50px!important;border:1px solid #d8d8d8!important;border-radius:12px!important;background:#fff!important;box-shadow:none!important;font-size:17px!important;padding:0 16px!important}
#catalogMount .filters{gap:7px!important}
#catalogMount .filter{min-height:40px!important;padding:8px 14px!important;border-radius:999px!important;background:#fff!important;border:1px solid #ddd!important;color:#333!important;font-size:13px!important}
#catalogMount .filter.on{background:#171717!important;color:#fff!important;border-color:#171717!important}
#catalogMount .main{padding-top:22px!important;background:#f7f7f7!important}
#catalogMount .catalog-head{margin-bottom:12px!important}
#catalogMount .catalog-head h1{color:#8f2227!important;font-size:clamp(27px,3.4vw,35px)!important;line-height:1.06!important;margin:0!important;letter-spacing:-.025em!important}
#catalogMount .catalog-head h1:before{content:none!important;display:none!important}
#catalogMount .catalog-head p{color:#707070!important;max-width:620px!important;margin-top:9px!important;line-height:1.35!important}
#catalogMount .trust{gap:6px!important;margin-top:10px!important}
#catalogMount .trust span{background:#fff!important;border:1px solid #dedede!important;border-radius:999px!important;padding:6px 9px!important;font-size:10.5px!important;color:#333!important;white-space:nowrap!important}
#catalogMount .count{color:#777!important;margin:12px 0 14px!important;font-size:14px!important}
#catalogMount .grid{gap:14px!important}
#catalogMount .card{border-radius:14px!important;border:1px solid #e5e5e5!important;box-shadow:0 4px 14px #00000008!important;overflow:hidden!important}
#catalogMount .pic{height:190px!important;background:#fff!important;padding:10px!important}
#catalogMount .pic img{max-width:100%!important}
#catalogMount .pic:after{background:#8f2227!important;border-radius:7px!important;font-size:10px!important;padding:6px 8px!important}
#catalogMount .info{padding:14px!important}
#catalogMount .name{font-size:17px!important;margin:7px 0 11px!important;min-height:auto!important}
#catalogMount .price{font-size:25px!important;color:#8f2227!important}
#catalogMount .buyways{margin-top:8px!important;gap:5px!important}
#catalogMount .buyways span{font-size:9px!important;padding:4px 6px!important;background:#f5f5f5!important}
#catalogMount .note{margin-top:8px!important}
#catalogMount .details{min-height:40px!important;margin-top:9px!important}
#catalogMount .interest{min-height:42px!important;margin-top:7px!important;background:#8f2227!important;border-radius:10px!important}
#catalogMount .foot{margin-top:18px!important}
@media(max-width:700px){
  .hero-cta{left:6.5%;bottom:3.7%;width:87%;height:6.5%;border-radius:18px}
  #catalogMount .tools{padding:12px 12px 10px!important}
  #catalogMount .toolrow{display:block!important;width:100%!important}
  #catalogMount .search{width:100%!important;min-height:46px!important;font-size:16px!important;border-radius:11px!important}
  #catalogMount .filters{width:100%!important;margin-top:9px!important;display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;overscroll-behavior-inline:contain!important;-webkit-overflow-scrolling:touch!important;padding:0 0 4px!important;scrollbar-width:none}
  #catalogMount .filters::-webkit-scrollbar{display:none}
  #catalogMount .filter{min-height:40px!important;padding:8px 13px!important;font-size:12.5px!important;flex:0 0 auto!important;touch-action:manipulation}
  #catalogMount .main{padding:18px 12px 36px!important;width:100%!important;overflow:hidden!important}
  #catalogMount .catalog-head{display:block!important;margin-bottom:8px!important}
  #catalogMount .catalog-head h1{font-size:28px!important;line-height:1.04!important;max-width:100%!important}
  #catalogMount .catalog-head p{font-size:14px!important;margin-top:7px!important;line-height:1.35!important}
  #catalogMount .trust{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important;padding-bottom:4px!important;margin-top:9px!important;scrollbar-width:none}
  #catalogMount .trust::-webkit-scrollbar{display:none}
  #catalogMount .trust span{font-size:10px!important;padding:6px 9px!important;flex:0 0 auto!important}
  #catalogMount .count{margin:10px 0 12px!important;font-size:13px!important}
  #catalogMount .grid{grid-template-columns:minmax(0,1fr)!important;gap:12px!important;width:100%!important}
  #catalogMount .card{width:100%!important;max-width:100%!important;border-radius:13px!important}
  #catalogMount .pic{height:190px!important;padding:8px!important}
  #catalogMount .pic img{width:100%!important;height:100%!important;object-fit:contain!important}
  #catalogMount .info{padding:13px!important}
  #catalogMount .name{font-size:17px!important;margin:6px 0 10px!important}
  #catalogMount .price{font-size:24px!important}
  #catalogMount .buyways{gap:4px!important}
  #catalogMount .buyways span{font-size:9px!important;padding:5px 6px!important}
  #catalogMount .details,#catalogMount .interest{width:100%!important;min-height:44px!important;font-size:14px!important;touch-action:manipulation}
  #catalogMount .modal{padding:10px!important}
  #catalogMount .sheet{width:calc(100vw - 20px)!important;max-width:calc(100vw - 20px)!important;max-height:92dvh!important;padding:16px!important;border-radius:16px!important;overflow:auto!important}
  #catalogMount .gallery-main{height:220px!important;margin:10px 0!important;padding:10px!important}
  #catalogMount .gallery-thumb{width:58px!important;height:48px!important;flex-basis:58px!important}
  #catalogMount .send,#catalogMount .close{min-height:44px!important;touch-action:manipulation}
}
@media(max-width:380px){
  #catalogMount .main{padding-left:10px!important;padding-right:10px!important}
  #catalogMount .catalog-head h1{font-size:26px!important}
  #catalogMount .pic{height:175px!important}
  #catalogMount .sheet{width:calc(100vw - 12px)!important;max-width:calc(100vw - 12px)!important;padding:14px!important}
}
</style>
</head>
<body>
<section class="hero" aria-label="LB MOTOS Honda 0 KM">
  <picture>
    <source media="(max-width:700px)" srcset="/assets/hero-mobile-v2.webp?v=5">
    <img src="/assets/hero-desktop-v2.webp?v=5" alt="LB MOTOS com Laysa e Honda ADV 160">
  </picture>
  <a class="hero-cta" href="#catalogMount" aria-label="Quero minha Honda"></a>
</section>
<div id="catalogMount"><div class="loading">Carregando catálogo...</div></div>
<script>
(async()=>{
  try{
    const html=await fetch('/catalog-core.html?v=4').then(r=>r.text());
    const doc=new DOMParser().parseFromString(html,'text/html');
    doc.querySelectorAll('style').forEach(s=>{const n=document.createElement('style');n.textContent=s.textContent;document.head.insertBefore(n,document.head.firstChild)});
    const mount=document.querySelector('#catalogMount');
    mount.innerHTML='';
    ['.tools','main','#bikeModal','#leadModal','.foot'].forEach(sel=>{const el=doc.querySelector(sel);if(el)mount.appendChild(document.importNode(el,true))});
    const src=doc.querySelector('script');
    if(src){const s=document.createElement('script');s.textContent=src.textContent;document.body.appendChild(s)}
  }catch(e){document.getElementById('catalogMount').innerHTML='<div class="loading">Não foi possível carregar o catálogo agora. <a href="https://wa.me/5521970993229">Fale no WhatsApp</a>.</div>'}
})();
</script>
</body>
</html>
